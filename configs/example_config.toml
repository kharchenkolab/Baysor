# Baysor config template. Every key is optional; the values below are the
# defaults. CLI flags override config values. See docs/configuration.md.

threads = 0 # Worker threads. 0: OMP_NUM_THREADS, then the number of physical CPU cores

[molecules]
x = "x" # Name of the x column in the input data
y = "y" # Name of the y column in the input data
z = "z" # Name of the z column in the input data (ignored if absent)
gene = "gene" # Name of the gene column in the input data
qv = "qv" # Name of the quality-score column (used only with min_qv)
min_qv = -1.0 # Drop molecules with a quality score below this value. Negative: no filter
force_2d = false # Ignore the z column even if it is present
min_molecules_per_gene = 1 # Drop genes with fewer molecules
exclude_genes = "" # Comma-separated gene names or wildcards to ignore. Example: "Blank*,MALAT1"
min_molecules_per_cell = 0 # Required, here or with -m: minimal number of molecules of a real cell. Several defaults below are derived from it
confidence_nn_id = 0 # Number of nearest neighbors used for the noise (confidence) estimate. 0: max(min_molecules_per_cell / 2 + 1, 5)

[prior]
unassigned_label = "0" # Prior label of molecules outside any prior cell (transcript-level prior column)
min_molecules_per_segment = 0 # Prior cells with fewer molecules are ignored. 0: max(min_molecules_per_cell / 4, 2)
estimate_scale_from_prior = true # Estimate the cell scale from the prior cells unless --scale is given

[segmentation]
scale = -1.0 # Approximate cell radius. Negative: estimated from the prior segmentation, which is then required
scale_std = "25%" # Standard deviation of the scale across cells: a number, or a percentage of the scale
prior_segmentation_confidence = 0.2 # Confidence of the prior segmentation, from 0 to 1
iters = 500 # Number of iterations of the segmentation algorithm
tol = 0.0 # Stop early once the fraction of molecules changing cell stays below this value. 0: run all iterations
n_cells_init = 0 # Initial number of cells. 0: estimated from the number of molecules, min_molecules_per_cell and the prior

cluster_method = "mrf" # Molecule clustering used as the cell-type prior: mrf, louvain, leiden or none
n_clusters = 0 # Number of molecule clusters. 0: 4 for mrf, 10 for louvain/leiden
cluster_resolution = 1.0 # louvain/leiden: resolution of the initial over-clustering
cluster_graph_k = 15 # louvain/leiden and NCV embeddings: neighbors in the NCV graph
cluster_n_dims = 20 # louvain/leiden: number of NCV dimensions
cluster_basis_sample_size = 100000 # louvain/leiden: maximal number of anchor molecules

[plotting]
gene_composition_neigborhood = 0 # Neighborhood size for the neighborhood composition vectors (NCVs). 0: max(n_genes / 10, min_molecules_per_cell, 3)
max_plot_size = 3000 # Longer side of the molecule plots of the HTML reports, in pixels
max_z_slices = 10 # Number of z-layers used for 3D polygons; more distinct z values are binned into this many layers
