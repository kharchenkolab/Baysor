name: platforms_build

on:
  push:
  pull_request:

env:
  VCPKG_DISABLE_METRICS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            triplet: x64-linux
          - name: macOS 14
            os: macos-14
            triplet: arm64-osx
          - name: Windows 2022
            os: windows-2022
            triplet: x64-windows
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite

    steps:
      - name: Checkout Baysor
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y -V \
            ca-certificates \
            lsb-release \
            wget \
            build-essential \
            ninja-build \
            libeigen3-dev \
            libspdlog-dev \
            libcgal-dev \
            libhdf5-dev \
            nlohmann-json3-dev \
            libtiff-dev
          wget "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr '[:upper:]' '[:lower:]')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y -V "./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get update
          sudo apt-get install -y -V libarrow-dev libparquet-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja eigen spdlog cgal apache-arrow hdf5 nlohmann-json libtiff

      - name: Read the vcpkg release (as the release builds do)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "VCPKG_GIT_REF=$(cat packaging/vcpkg-ref)" >> "$GITHUB_ENV"

      - name: Checkout vcpkg
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_GIT_REF }}
          path: .vcpkg

      - name: Restore vcpkg binary cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: .vcpkg-bincache
          key: ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-${{ env.VCPKG_GIT_REF }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'packaging/vcpkg-overlay-ports/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.triplet }}-vcpkg-${{ env.VCPKG_GIT_REF }}-

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure Ubuntu
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBAYSOR_WITH_TESTS=OFF

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBAYSOR_WITH_TESTS=OFF

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $configureArgs = @(
            "-S", ".",
            "-B", "build/ci",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DBAYSOR_WITH_TESTS=OFF",
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake",
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}",
            "-DVCPKG_INSTALLED_DIR=$env:RUNNER_TEMP/vcpkg_installed"
          )

          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Configure attempt $attempt of $maxAttempts"
            & cmake @configureArgs
            if ($LASTEXITCODE -eq 0) {
              break
            }
            if ($attempt -eq $maxAttempts) {
              exit $LASTEXITCODE
            }
            Write-Host "Configure failed, retrying after a short delay..."
            Start-Sleep -Seconds (30 * $attempt)
          }

      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build/ci --target baysor --parallel

      - name: Build
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build/ci --config Release --target baysor --parallel

      # vcpkg removes a port's logs only after it builds successfully.
      - name: Upload vcpkg failure logs
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.triplet }}
          path: .vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  ubuntu_tests:
    name: Ubuntu tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Baysor
        uses: actions/checkout@v4

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -V \
            ca-certificates \
            lsb-release \
            wget \
            build-essential \
            ninja-build \
            libeigen3-dev \
            libspdlog-dev \
            libcgal-dev \
            libhdf5-dev \
            nlohmann-json3-dev \
            libtiff-dev \
            libgtest-dev
          wget "https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr '[:upper:]' '[:lower:]')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y -V "./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get update
          sudo apt-get install -y -V libarrow-dev libparquet-dev

      - name: Configure tests
        run: |
          cmake -S . -B build/tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBAYSOR_WITH_TESTS=ON

      - name: Build tests
        run: cmake --build build/tests --target baysor baysor_tests --parallel

      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure
