name: docs

on:
  push:
    branches: ['**']
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  # `prereleased` + `released` fire exactly once per published release, and
  # `released` fires again when a pre-release is promoted to a full release,
  # so promotion moves `latest` without a manual redeploy. (`published` would
  # miss promotions, and `published` + `released` would deploy twice.)
  release:
    types: [prereleased, released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)deploy, e.g. cpp-0.8.3 or v0.8.3'
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build docs (strict)
    if: github.event_name != 'release' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs tooling
        run: python -m pip install -r docs/requirements.txt

      - name: Check docs against the CLI and config parser
        run: python docs/tools/check_cli_docs.py

      - name: Build the site (strict)
        run: mkdocs build --strict

  deploy:
    name: Deploy docs version
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Serialize deploys so two runs can never race on the gh-pages branch.
    # This is deliberately job-level: a workflow-level group would let queued
    # push/PR builds cancel pending deploys in the same group.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Resolve version and pre-release flag from tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            IS_PRERELEASE="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
          else
            TAG="$RELEASE_TAG"
            IS_PRERELEASE="$RELEASE_PRERELEASE"
          fi
          # Version = tag with a leading `cpp-` and then `v` stripped:
          # cpp-0.8.3 -> 0.8.3, v0.8.3 -> 0.8.3
          VERSION="${TAG#cpp-}"
          VERSION="${VERSION#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs tooling
        run: python -m pip install -r docs/requirements.txt

      - name: Check docs against the CLI and config parser
        run: python docs/tools/check_cli_docs.py

      # The version is always deployed; `latest` and the default redirect
      # only move to it when it is not a pre-release and is >= every version
      # in `mike list --json`, so redeploys of older tags and backports keep
      # `latest` where it is. Same rule as packaging/is_latest_release.py
      # (Docker `latest`), inlined because older release tags lack that file.
      - name: Decide whether to move the `latest` alias
        id: latest
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IS_PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          MOVE="$(python - <<'EOF'
          import json, os, re, subprocess

          version = os.environ["VERSION"]
          is_prerelease = os.environ["IS_PRERELEASE"].lower() == "true"
          version_re = re.compile(r"^v?(\d+(?:\.\d+)*)(?:[-.]?(.+))?$")

          def version_key(v):
              m = version_re.match(v.strip())
              if not m:
                  return None
              return (tuple(int(p) for p in m.group(1).split(".")),
                      not m.group(2), m.group(2) or "")

          out = subprocess.run(["mike", "list", "--json"], check=True,
                               text=True, capture_output=True).stdout
          keys = [version_key(e["version"]) for e in json.loads(out or "[]")]
          keys = [k for k in keys if k is not None]
          new = version_key(version)
          move = (not is_prerelease and new is not None
                  and all(new >= k for k in keys))
          print("true" if move else "false")
          EOF
          )"
          echo "move=$MOVE" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          MOVE_LATEST: ${{ steps.latest.outputs.move }}
        run: |
          if [ "$MOVE_LATEST" = "true" ]; then
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          else
            mike deploy --push "$VERSION"
          fi
