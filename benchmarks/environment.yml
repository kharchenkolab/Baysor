name: baysor-bench
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pandas
  - pyarrow
  - scikit-learn
  - matplotlib
  - anndata
  - scanpy
  - h5py
  - zarr
  - shapely
  - tifffile
  - pyyaml
  - requests
  - pytest
  - pip
  - pip:
      - remotezip
      - pyflakes
      # build deps for the cellAdmix Python bindings; the bindings themselves
      # are installed from the pinned+patched source by benchmarks/celladmix/install.sh
      - scikit-build-core
      - pybind11
