# Benchmark suites for the Baysor harness (see benchmarks/harness/suites.py
# for the schema and benchmarks/README.md -> "How to test a change").
#
# Every step is one run.py invocation; steps sharing a `group` write into the
# same runs/<id> folder (one comparison per group in compare.py --suite).
#
# `regular` — run on every change/PR. Measured cost of the dataset list at
#   6 threads (baselines/bugfixes-35e8a7e/resources.csv): the 24 noise-step
#   datasets sum to ~831 s Baysor wall + ~25 s cellAdmix audit per replicate;
#   the 4 exact-step datasets cost ~226 s at 1 thread. One replicate per step
#   (the `same` gates tolerate a single run replicate: the tolerances are
#   max(3 * pooled baseline SD, floor) with floors >= the baseline replicate
#   noise, and real gates compare run rep x baseline rep pairs) keeps the
#   suite at ~20 min wall including metrics bookkeeping, with AMI skipped
#   (`no_ami`, informational only) — 3 replicates would cost ~40 min of
#   Baysor time alone. Release re-runs everything at 3 replicates.
#
# Coverage of the regular dataset list:
#   * every trivial.py scenario, with and without prior (12 datasets);
#   * st-recoverability sparse and dense packing;
#   * one 3D simulation;
#   * every real platform at quick tier (Xenium, CosMx, MERFISH, ISS,
#     osmFISH, STARmap);
#   * gene-panel classes tiny..huge via cheap quick crops
#     (strec tiny, circles/iss small, pancreas medium, cosmx/starmap large,
#     xenium_prime5k_ovarian_quick huge);
#   * one admixture crop: xenium_lung_cancer_admix (~97 s/rep, 550k
#     molecules) so the cellAdmix audit and the admixture gate run on a
#     full-size *_admix crop regularly — it fits the budget; the quick
#     Xenium crops in the list additionally exercise the audit on quick data.
suites:
  regular:
    description: >-
      Fast gate for every change/PR: bitwise-identical check at 1 thread on a
      representative subset, plus a 6-thread noise-floor run of the coverage
      list with the cellAdmix audit (including one *_admix crop).
    budget_minutes: 20
    resources: baselines/bugfixes-35e8a7e/resources.csv
    steps:
      - name: exact
        group: exact
        datasets:
          - sim_circles_gaps_g100
          - sim_circles_gaps_g100_noprior
          - strec_dense_s2_disjoint
          - xenium_pancreas_377_quick
        threads: 1
        replicates: 1
        timeout: 1800
        celladmix: false
        no_ami: true
        expect: identical
        baseline: bugfixes-35e8a7e-t1
      - name: noise
        group: noise
        datasets:
          # trivial.py scenarios, with and without prior
          - sim_circles_gaps_g100
          - sim_circles_gaps_g100_noprior
          - sim_elongated_gaps_g100
          - sim_elongated_gaps_g100_noprior
          - sim_mixed_sizes_g100
          - sim_mixed_sizes_g100_noprior
          - sim_sparse_noisy_g100
          - sim_sparse_noisy_g100_noprior
          - sim_tiled_distinct_g100
          - sim_tiled_distinct_g100_noprior
          - sim_tiled_same_g100
          - sim_tiled_same_g100_noprior
          # st-recoverability: sparse and dense packing, one 3D sim
          - strec_sparse_s2_disjoint
          - strec_dense_s2_disjoint
          - sim_circles_gaps_3d_g100
          # every real platform, quick tier
          - xenium_pancreas_377_quick
          - cosmx_nsclc_lung5_rep1_quick
          - merfish_ileum_quick
          - iss_mouse_hippocampus_quick
          - osmfish_somatosensory_quick
          - starmap_visual_cortex_quick
          # gene-panel class 'huge' via a cheap quick crop
          - xenium_prime5k_ovarian_quick
          # admixture gate: one full-size *_admix crop
          - xenium_lung_cancer_admix
        threads: 6
        replicates: 1
        timeout: 1800
        celladmix: true
        celltypes_from: bugfixes-35e8a7e
        no_ami: true
        expect: same
        baseline: bugfixes-35e8a7e

  release:
    description: >-
      Full pre-release validation: every quick and full dataset at 6 threads
      x 3 replicates with the cellAdmix audit, plus the 1-thread bitwise
      check over the whole quick tier (this is the benchbase-b + benchbase-t1
      configuration used to create the official baselines).
    resources: baselines/bugfixes-35e8a7e/resources.csv
    steps:
      - name: quick6
        group: noise
        datasets: quick
        threads: 6
        replicates: 3
        timeout: 1800
        celladmix: true
        celltypes_from: bugfixes-35e8a7e
        expect: same
        baseline: bugfixes-35e8a7e
      - name: full6
        group: noise
        datasets: full
        threads: 6
        replicates: 3
        timeout: 5400
        celladmix: true
        celltypes_from: bugfixes-35e8a7e
        expect: same
        baseline: bugfixes-35e8a7e
      - name: quick1
        group: exact
        datasets: quick
        threads: 1
        replicates: 1
        timeout: 1800
        celladmix: false
        expect: identical
        baseline: bugfixes-35e8a7e-t1
