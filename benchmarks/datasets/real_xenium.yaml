schema_version: 1
group: real_xenium
kind: real
platform: Xenium
retrieved: '2026-09-29'
defaults:
  min_qv: 20
  baysor:
    config: configs/xenium.toml
    scale_std: 25%
    min_molecules_per_cell: 50
    prior: column
    prior_confidence: 0.5
    # our prior column is numeric (0 = no prior); configs/xenium.toml sets
    # unassigned_label = UNASSIGNED which would make label 0 a real segment
    extra_args:
    - -x
    - x
    - -y
    - y
    - -g
    - gene
    - --qv-column
    - qv
    - --unassigned-prior-label
    - '0'
datasets:
- id: xenium_pancreas_377_full
  tissue: pancreas (FFPE)
  tier: full
  source:
    name: Xenium_V1_human_Pancreas_FFPE
    version: 2.0.0
    url: https://cf.10xgenomics.com/samples/xenium/2.0.0/Xenium_V1_human_Pancreas_FFPE/Xenium_V1_human_Pancreas_FFPE_outs.zip
    zip_bytes: 5690354514
    original_dataset: FFPE Human Pancreas with Xenium Multimodal Cell Segmentation
    page: https://www.10xgenomics.com/datasets/ffpe-human-pancreas-with-xenium-multimodal-cell-segmentation-1-standard
    license: 10x Genomics terms of use (https://www.10xgenomics.com/legal/terms-of-use)
    doi: null
    retrieved: '2026-09-29'
  members:
    transcripts: transcripts.parquet
    cells: cells.parquet
    cell_boundaries: cell_boundaries.parquet
    nucleus_boundaries: nucleus_boundaries.parquet
    experiment: experiment.xenium
    gene_panel: gene_panel.json
  # multi-file OME focus image: channel N lives in file NNNN
  # (0000 = DAPI, 0001 = boundary stain ATP1A1/CD45/E-Cadherin)
  images:
    focus_members:
    - morphology_focus/morphology_focus_0000.ome.tif
    - morphology_focus/morphology_focus_0001.ome.tif
    - morphology_focus/morphology_focus_0002.ome.tif
    - morphology_focus/morphology_focus_0003.ome.tif
    channels:
      dapi: 0
      boundary: 1
  crop:
    bbox_um:
    - 4350.0
    - 400.0
    - 6350.0
    - 2400.0
    within: null
    target_molecules: 2000000
    min_molecules: 1000000
    max_molecules: 3000000
    min_cells: 1000
    min_coverage: 0.75
    density_hint: any
    note: 'Full crop of the multimodal-segmentation FFPE pancreas section: the densest
      continuous tissue block with 1-3M filtered molecules, chosen on the vendor density
      histogram to avoid empty gaps; the quick pancreas crop is nested inside it.'
    pick:
      mols: 1999991
      cells: 39309
      coverage: 1.0
      cells_per_mm2: 9827.2
      density_hint: any
      relaxed_density: false
