# BENCH-REALO manifest: real benchmark datasets from non-Xenium imaging
# platforms (ISS, osmFISH, STARmap, MERFISH, CosMx).  Consumed by
# benchmarks/fetch/other.py:
#
#   python benchmarks/fetch/other.py build     # download sources, write
#                                             # $BAYSOR_BENCH_DATA/real/<id>/
#   python benchmarks/fetch/other.py smoke     # run Release Baysor on quick crops
#   python benchmarks/fetch/other.py report    # stats table
#
# Availability, pixel-size derivations and download sizes for every candidate
# (including the ones that were *not* obtainable) are inventoried in
# benchmarks/datasets/real_other_inventory.md.
#
# `crop.target_molecules`/`cap` drive the deterministic densest-window search
# (seeded; the resulting bounding box is recorded in each meta.json).
# `baysor.scale_um` entries marked as placeholders are recomputed by the
# builder from vendor cell sizes and written into meta.json.

version: 1
group: real_other

datasets:
  # --- ISS mouse hippocampus, ~99-gene panel, sparse ---------------------
  - id: iss_mouse_hippocampus_quick
    builder: iss
    tier: quick
    platform: ISS
    tissue: mouse hippocampus (CA1), coronal section 3-3 right
    seed: 20260929
    source:
      url: http://pklab.med.harvard.edu/viktor/baysor/iss/
      doi: 10.6084/m9.figshare.7150760.v1
      license: CC BY 4.0 (figshare pciSeq release; example files from the Baysor repo)
      original_dataset: >-
        Qian et al., A spatial atlas of inhibitory cell types in mouse
        hippocampus (pciSeq); section 3-3 right molecules + published
        watershed DAPI mask
    crop:
      strategy: densest_window
      target_molecules: 150000
      cap: 150000
    exclude_genes: []
    baysor:
      scale_um: 2.1667        # examples/iss/README.md --scale 6.5 px * 1/3 um/px
      scale_std: "25%"        # Baysor default (README passes nothing)
      min_molecules_per_cell: 2
      prior_confidence: 0.2   # Baysor default
      config: configs/iss.toml
      extra_args: []

  # --- osmFISH somatosensory cortex, 35-gene panel, sparse ---------------
  - id: osmfish_somatosensory_quick
    builder: osmfish
    tier: quick
    platform: osmFISH
    tissue: mouse somatosensory cortex (coronal section)
    seed: 20260929
    source:
      url: http://pklab.med.harvard.edu/viktor/baysor/osm_fish/
      doi: 10.1038/s41592-018-0175-z
      license: published research data (Codeluppi et al. 2018)
      original_dataset: >-
        Codeluppi et al. osmFISH mRNA coordinates (pklab example csv), vendor
        cell polygons from the vitessce mirror of polyT_seg.pkl
    crop:
      strategy: densest_window
      target_molecules: 150000
      cap: 150000
    exclude_genes: []
    baysor:
      scale_um: 5.33          # examples/osm-FISH/README.md --scale 82 px * 0.065 um/px
      scale_std: 3.12         # --scale-std 48 px * 0.065 um/px (absolute)
      min_molecules_per_cell: 30
      prior_confidence: 0.2
      config: configs/osm_fish.toml
      extra_args: []

  # --- STARmap visual cortex, 1020 genes, 3D, medium density -------------
  - id: starmap_visual_cortex_quick
    builder: starmap
    tier: quick
    platform: STARmap
    tissue: mouse visual cortex (V1), 3D strip, 1020-gene panel
    seed: 20260929
    source:
      url: http://pklab.med.harvard.edu/viktor/baysor/starmap/
      doi: 10.1126/science.aat5691
      license: published research data (Wang et al. 2018, Science)
      original_dataset: >-
        Wang et al. STARmap visual cortex dataset 20180410-BY3_1kgenes
        (pklab example molecules.csv + segmentation.tiff)
    crop:
      strategy: densest_window
      target_molecules: 150000
      cap: 150000
    exclude_genes: []
    baysor:
      scale_um: 7.3175        # placeholder: builder sets 89.995 px * um/px from README
      scale_std: 1.3333       # placeholder: 16.398 px * um/px
      min_molecules_per_cell: 70
      prior_confidence: 0.2
      config: configs/starmap.toml
      extra_args: []

  # --- MERFISH mouse ileum, 241 genes + blanks, 3D -----------------------
  - id: merfish_ileum_quick
    builder: ileum
    tier: quick
    platform: MERFISH
    tissue: mouse ileum epithelium (FFPE region, MERFISH)
    seed: 20260929
    source:
      url: https://datadryad.org/stash/downloads/file_stream/1019818
      doi: 10.5061/dryad.jm63xsjb2
      license: CC CC0 (Dryad data release)
      original_dataset: >-
        Petukhov et al. 2022 (Baysor paper) MERFISH mouse ileum data release
        (Xu/Moffitt lab), raw molecules + DAPI/membrane stacks + Cellpose
        segmentation
    crop:
      strategy: densest_window
      target_molecules: 150000
      cap: 150000
    exclude_genes: ["Blank*"]
    baysor:
      scale_um: 10.0          # placeholder: builder sets median Cellpose radius
      scale_std: "50%"        # release CLI: --scale-std=50%
      min_molecules_per_cell: 30   # release CLI: -m 30
      prior_confidence: null
      config: configs/example_config.toml
      extra_args: []

  - id: merfish_ileum_full
    builder: ileum
    tier: full
    platform: MERFISH
    tissue: mouse ileum epithelium (FFPE region, MERFISH)
    seed: 20260929
    source:
      url: https://datadryad.org/stash/downloads/file_stream/1019818
      doi: 10.5061/dryad.jm63xsjb2
      license: CC CC0 (Dryad data release)
      original_dataset: >-
        Petukhov et al. 2022 (Baysor paper) MERFISH mouse ileum data release
    crop:
      strategy: full_field
      target_molecules: 3000000
      cap: 3000000
    exclude_genes: ["Blank*"]
    baysor:
      scale_um: 10.0
      scale_std: "50%"
      min_molecules_per_cell: 30
      prior_confidence: null
      config: configs/example_config.toml
      extra_args: []

  # --- CosMx NSCLC Lung5_Rep1, 960 genes, dense tumour -------------------
  - id: cosmx_nsclc_lung5_rep1_quick
    builder: cosmx_nsclc
    tier: quick
    platform: CosMx SMI
    tissue: human NSCLC FFPE tumour (Lung5_Rep1)
    seed: 20260929
    source:
      url: https://nanostring-public-share.s3.us-west-2.amazonaws.com/SMI/
      doi: 10.1101/2021.11.03.467020
      license: NanoString/Bruker public FFPE dataset (open download, no registration)
      original_dataset: >-
        NanoString CosMx SMI NSCLC public dataset, sample Lung5_Rep1
        (transcript file, cell metadata, per-FOV CellLabels)
    crop:
      strategy: densest_window
      target_molecules: 150000
      cap: 150000
    exclude_genes:
      ["Blank*", "NegControl*", "NegCtrl*", "NegProbe*", "NegPrb*", "Negative*",
       "SystemControl*", "System Control*"]
    baysor:
      scale_um: 8.0           # placeholder: builder sets median vendor radius
      scale_std: "25%"
      min_molecules_per_cell: 20
      prior_confidence: null
      config: configs/example_config.toml
      extra_args: []

  - id: cosmx_nsclc_lung5_rep1_full
    builder: cosmx_nsclc
    tier: full
    platform: CosMx SMI
    tissue: human NSCLC FFPE tumour (Lung5_Rep1)
    seed: 20260929
    source:
      url: https://nanostring-public-share.s3.us-west-2.amazonaws.com/SMI/
      doi: 10.1101/2021.11.03.467020
      license: NanoString/Bruker public FFPE dataset (open download, no registration)
      original_dataset: >-
        NanoString CosMx SMI NSCLC public dataset, sample Lung5_Rep1
    crop:
      strategy: full_fov
      target_molecules: 3000000
      cap: 3000000
    exclude_genes:
      ["Blank*", "NegControl*", "NegCtrl*", "NegProbe*", "NegPrb*", "Negative*",
       "SystemControl*", "System Control*"]
    baysor:
      scale_um: 8.0
      scale_std: "25%"
      min_molecules_per_cell: 20
      prior_confidence: null
      config: configs/example_config.toml
      extra_args: []

  # --- CosMx Whole Transcriptome colon, ~19k panel, dense ----------------
  - id: cosmx_wtx_colon_quick
    builder: cosmx_wtx
    tier: quick
    platform: CosMx SMI
    tissue: human colon FFPE (WTX colon discovery dataset)
    seed: 20260929
    smoke_record_default_timeout: 1200
    source:
      url: https://objects.liquidweb.services/smi-public/wtx_manuscript/colon_discovery/
      doi: null
      license: Bruker/NanoString public CosMx WTX dataset (open download, no registration)
      original_dataset: >-
        CosMx Human Whole Transcriptome (WTX) colon discovery FFPE dataset
        (S0_tx_file + metadata + FOV positions)
    crop:
      strategy: densest_window
      target_molecules: 150000
      cap: 150000
    exclude_genes:
      ["Blank*", "NegControl*", "NegCtrl*", "NegProbe*", "NegPrb*", "Negative*",
       "SystemControl*", "System Control*"]
    baysor:
      scale_um: 8.0           # placeholder: builder sets median vendor radius
      scale_std: "25%"
      min_molecules_per_cell: 20
      prior_confidence: null
      config: configs/example_config.toml
      extra_args: ["--cluster-method", "louvain"]

  - id: cosmx_wtx_colon_full
    builder: cosmx_wtx
    tier: full
    platform: CosMx SMI
    tissue: human colon FFPE (WTX colon discovery dataset)
    seed: 20260929
    source:
      url: https://objects.liquidweb.services/smi-public/wtx_manuscript/colon_discovery/
      doi: null
      license: Bruker/NanoString public CosMx WTX dataset (open download, no registration)
      original_dataset: >-
        CosMx Human Whole Transcriptome (WTX) colon discovery FFPE dataset
    crop:
      strategy: full_fov
      target_molecules: 3000000
      cap: 3000000
    exclude_genes:
      ["Blank*", "NegControl*", "NegCtrl*", "NegProbe*", "NegPrb*", "Negative*",
       "SystemControl*", "System Control*"]
    baysor:
      scale_um: 8.0
      scale_std: "25%"
      min_molecules_per_cell: 20
      prior_confidence: null
      config: configs/example_config.toml
      extra_args: ["--cluster-method", "louvain"]
