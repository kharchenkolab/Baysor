# Simulated datasets of the Baysor benchmark suite (contract: benchmarks/README.md).
#
# Regenerate everything with:
#   BAYSOR_BENCH_DATA=... .deps/bench/bin/python benchmarks/simulate/generate_all.py
#   ... generate_all.py --update-hashes     # (re)record the sha256 block below
# Regenerate one dataset and verify byte-identity:
#   ... generate_all.py --verify <id>       # disk + regeneration vs this manifest
#   ... generate_all.py --verify-all
#
# Design notes:
# * The trivial panel variants (g100/g1000/g5000) and the tiled pair share one
#   seed, so they share geometry and molecule counts; only the gene panel (and
#   for tiled_distinct the type profiles) changes — a controlled panel ablation.
# * st-recoverability datasets are a design over the factors (packing,
#   displacement sigma, expression model, geometry, ambient noise), not the
#   full cartesian product; dense + sigma=2 + realistic is covered by
#   strec_dense_s2_merfish and strec_dense_s2_xenium.
# * `<id>_noprior` entries are derived from their base entry: the same
#   molecules with the prior column dropped and baysor.prior = none, so
#   Baysor's default no-prior mode is measured against identical truth.
#   (No noprior variant of the full-tier tiled_distinct: new datasets must
#   stay in the quick tier; sim_tiled_distinct_g1000_noprior covers the same
#   scenario and panel.)
# * `<id>_imprior` entries share their base's seed and params but degrade the
#   prior column (20% nuclei missed, nuclei shifted 1-2 um, 5% of priors
#   merged onto a neighbour); the truth is unchanged.
# * strec_*_ambient5/20 add 5%/20% uniform background molecules (cell = 0)
#   in the wrapper; strec_ultrasparse_* is a truly sparse field (1000
#   cells/mm2, contract class "sparse"); prime5k models come from the Xenium
#   Prime 5K ovarian cell_feature_matrix.h5 (fetched via remotezip);
#   *_aniso uses the upstream anisotropic label mode (elongated cells);
#   *_3d adds a z column in the wrapper; *_full is the single ~1M-molecule
#   full-tier dataset.
# * Every entry records the sha256 of molecules.parquet and meta.json; they
#   are checked by generate_all.py --verify-all.
# * All datasets are quick tier (<= ~150k molecules) except the two full-tier
#   entries (tiled_distinct at 1000 genes, dense strec xenium at ~1M
#   molecules).

version: 1

generators:
  trivial:
    entry: benchmarks/simulate/trivial.py
    generator_version: 1
    note: in-repo scenarios with exact ground truth (no displacement noise)
  strec:
    entry: benchmarks/simulate/strec.py
    generator_version: 1
    external:
      name: st-recoverability
      repo: https://github.com/RuiYamasaki/st-recoverability
      commit: e85faeccfb58e0bef05d76817e98c79abff6bf51
      license: MIT
      cache: cache/sim/st-recoverability
      imported_modules: [generator, expression, oracle, config]
    references:
      merfish: squidpy MERFISH_0.24.h5ad mirror, figshare file 40038538
      xenium: Xenium_FFPE_Human_Breast_Cancer_Rep1 (10x release 1.0.1),
        cell_feature_matrix.h5 + cells.parquet fetched from outs.zip via remotezip
      prime5k: Xenium_Prime_Ovarian_Cancer_FFPE_XRrun (10x release 3.0.0),
        cell_feature_matrix.h5 fetched from outs.zip via remotezip
  noprior:
    entry: benchmarks/simulate/generate_all.py (derive)
    generator_version: 1
    note: "derived from another entry (base): same molecules, no prior
      column, meta.baysor.prior = none"

